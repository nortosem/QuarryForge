# ===================================================================
# pyproject.toml for the quarryforge package
# ===================================================================
[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quarryforge"
version = "0.0.0dev0"
description = "A Python package for interacting with and migrating Fossil SCM repositories."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "mesotron.dev", email = "mail@mesotron.dev" },
]
maintainers = [
  { name = "mesotron.dev", email = "mail@mesotron.dev" },
]
keywords = ["fossil", "export", "scm", "vcs", "git", "migration", "github"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Version Control",
  "Typing :: Typed",
  "Topic :: Utilities",
]

# --- Runtime Dependencies ---
dependencies = []

[project.optional-dependencies]
# Development dependencies for testing, linting, and formatting.
# Install with: pip install -e .[dev]
dev = [
  "click",
  "coverage>=7.9",
  "coverage[toml]>=7.5.0",
  "freezegun>=1.5.2",
  "pytest>=8.0",
  "pytest-mock>=3.14",
  "mypy>=1.16.0",
  "mypy_extensions>=1.0.0",
  "ruff>=0.12",
]

[project.urls]
#Homepage = "https://github.com/user/quarryforge"
Repository = "https://github.com/nortosem/quarryforge"
#"Bug Tracker" = "https://github.com/user/quarryforge/issues"

[project.scripts]
# ruff scripts
format-code = "scripts:format_code"
lint = "scripts:lint"
# mypy scripts
check-types = "scripts:type_check"
quality = "scripts:quality"
# pytest & coverage
run-coverage = "scripts:run_coverage"
report-coverage = "scripts:report_coverage"
full-coverage = "scripts:full_coverage"

# ===================================================================
# Tool Configurations
# ===================================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["quarryforge*", "scripts.py"]

# ===================================================================
# Ruff Configuration (Linter and Formatter)
# ===================================================================
[tool.ruff]
# Global settings for both linter and formatter
target-version = "py313"
line-length = 80
exclude = [".venv", ".git", "__pycache__", "build", "dist"]
cache-dir = "./dist/.ruff_cache"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PL", "D"]
ignore = [
    "PLR0904", "PLR2004", "D100", "D101", "D102", "D103", "D104",
    "D105", "D106", "D107", "D203", "D213", "PLR1722",
]
dummy-variable-rgx = "^(_|main)$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D107", "PLR0904"]

[tool.ruff.lint.pylint]
max-args = 10
max-returns = 15
max-branches = 18

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "classproperty"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-line-length = 80


# ===================================================================
# MyPy Configuration
# ===================================================================
[tool.mypy]
mypy_path = "src"
python_version = "3.13"
pretty = true
cache_dir = "./dist/.mypy_cache"
sqlite_cache = true
cache_fine_grained = true
exclude = [
    "tests/", "build/", "dist/", "dev_env/", "prod_env/",
    "src/portfolio_project.egg-info/", "requirements.py",
]

strict = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = false
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# ===================================================================
# PyTest & Coverage Configuration
# ===================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -vv --strict-markers --basetemp=dist/tmp"
cache_dir = "dist/.pytest_cache"
tmp_path_retention_count = 5
tmp_path_retention_policy = "failed"
# --- LOGGING CONFIGURATION ---
log_cli = true
log_cli_level = "INFO"
log_auto_indent = true
log_file = "dist/log/pytest.log"
log_file_level = "INFO"

[tool.coverage.run]
source = ["quarryforge", "scripts"]
data_file = "./dist/.coverage"
branch = true
omit = [
    "*/__init__.py",
    "*/dev_env/*",
    "*/prod_env/*",
    "*/dist/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__:"',
    "@(abc\\.)?abstractmethod",
    "^\\s*pass\\s*$",
]

[tool.coverage.html]
skip_empty = true
skip_covered = false
directory = "dist/docs/coverage_report"
